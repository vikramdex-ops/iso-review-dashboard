name: ✨ Feature request
description: Suggest an addition to the dashboard, the sync logic, or the pattern in general
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or awkward right now
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to see instead
    validations:
      required: true
