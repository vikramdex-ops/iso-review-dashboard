name: Refresh data and deploy
on:
  push: { branches: [main] }
  # Every 45 minutes (UTC). Cron has no 45-minute step (*/45 fires at :00 and :45), and the
  # 45-minute cycle repeats every 3 hours, so four staggered 3-hourly crons give an exact
  # 00:00, 00:45, 01:30, 02:15, 03:00 ... cadence.
  schedule:
    - cron: "0 0-21/3 * * *"
    - cron: "45 0-21/3 * * *"
    - cron: "30 1-22/3 * * *"
    - cron: "15 2-23/3 * * *"
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sync from Google Sheets
        env:
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
        run: python scripts/build_summary.py
        # No continue-on-error: if the sync fails, the job stops here and the
        # previously deployed site is left untouched instead of silently redeploying stale/placeholder data.
        # GOOGLE_SHEETS_API_KEY (optional but recommended): reads tabs via the Sheets API instead
        # of the public CSV export, which bypasses any active "Data > Create a filter" on a tab
        # so a lead always gets the real, unfiltered row count. Falls back to CSV export (which
        # a live filter CAN hide rows from) when this secret isn't set.
      - name: Commit synced data snapshot (for auditability)
        run: |
          git config user.name "iso-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/summary.json site/data/closed_log.json site/config.json
          git diff --cached --quiet || git commit -m "Auto-sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
      - name: Inject the issue-writer token into the deploy artifact only (never committed)
        env:
          ISSUE_PAT: ${{ secrets.ISSUE_PAT }}
        run: |
          if [ -z "$ISSUE_PAT" ]; then
            echo "::warning::ISSUE_PAT repo secret is not set — 'Mark as issued' will show its fallback link instead of writing directly."
          else
            sed -i "s/__ISSUE_PAT__/$ISSUE_PAT/" site/index.html
          fi
          # This only edits the runner's working copy for the Pages upload below;
          # the earlier commit step already ran, so the placeholder is what stays in git.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
